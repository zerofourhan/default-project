<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>沙灘排球 Volleyball · 2v2</title>
  <meta name="description" content="2D 沙灘排球。2 對 2、三觸球分工：接一傳→托二傳→扣球。玩家選擇位置與搭檔，對戰流暢的電腦隊。" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🏐</span>
        <div>
          <h1>沙灘排球</h1>
          <p class="sub">Volleyball · 2v2 · 三觸球分工</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="sound-toggle" aria-label="音效切換" title="音效切換">🔊</button>
        <button type="button" class="icon-btn" id="menu-btn" aria-label="選單" title="選單 / ESC">☰</button>
      </div>
    </header>

    <div class="scoreboard">
      <div class="score you">
        <span class="score-name">你 · <b id="your-pos">主攻手</b></span>
        <span id="your-score" class="score-num">0</span>
      </div>
      <div class="serve">
        <span id="serve-indicator">你發球</span>
        <span id="serve-status">F 發球</span>
      </div>
      <div class="score cpu">
        <span id="cpu-score" class="score-num">0</span>
        <span class="score-name"><b id="cpu-pos">副攻手</b> · 電腦</span>
      </div>
    </div>

    <div class="skillbar">
      <div class="skill you">
        <span class="skill-icon" id="your-skill-icon">⚡</span>
        <div class="skill-info">
          <span class="skill-name" id="your-skill-name">加速扣球</span>
          <div class="cd"><div class="cd-fill" id="your-cd-fill"></div></div>
        </div>
        <span class="touch">E</span>
      </div>
      <span class="skill-vs">VS</span>
      <div class="skill cpu">
        <span class="touch">E</span>
        <div class="skill-info">
          <span class="skill-name" id="cpu-skill-name">攔網</span>
          <div class="cd"><div class="cd-fill" id="cpu-cd-fill"></div></div>
        </div>
        <span class="skill-icon" id="cpu-skill-icon">🛡️</span>
      </div>
    </div>

    <div class="stage">
      <canvas id="game" width="1600" height="1000"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="overlay-title">選擇你的位置</h2>
          <p id="overlay-text">選主攻或副攻時，搭檔固定為舉球；選舉球時，搭檔由主攻／副攻中擇一。</p>
          <div class="pos-grid" id="pos-grid">
            <button type="button" class="pos-card selected" id="pos-spiker" data-pos="spiker">
              <span class="pos-icon">⚡</span>
              <span class="pos-name">主攻手</span>
              <span class="pos-stat">攻擊 ★★★ · 跳躍 ★★★</span>
              <span class="pos-stat">速度 ★★ · 攔網 ★★</span>
              <span class="pos-skill">技能：加速扣球 · 扣得更重</span>
            </button>
            <button type="button" class="pos-card" id="pos-blocker" data-pos="blocker">
              <span class="pos-icon">🛡️</span>
              <span class="pos-name">副攻手</span>
              <span class="pos-stat">攔網 ★★★ · 跳躍 ★★★</span>
              <span class="pos-stat">攻擊 ★★ · 防守 ★★</span>
              <span class="pos-skill">技能：攔網 · 反彈電腦扣球</span>
            </button>
            <button type="button" class="pos-card" id="pos-setter" data-pos="setter">
              <span class="pos-icon">🎯</span>
              <span class="pos-name">舉球員</span>
              <span class="pos-stat">托球 ★★★ · 精準 ★★★</span>
              <span class="pos-stat">防守 ★★ · 速度 ★★</span>
              <span class="pos-skill">技能：精準托球 · 托給搭檔扣</span>
            </button>
          </div>
          <p class="hint">控制：空白/↑=起跳 · E=扣球/舉球 · Q=接一傳 · Shift=技能</p>
          <button type="button" class="primary-btn" id="start-btn">開始比賽</button>
        </div>
      </div>

      <div class="overlay hidden" id="mate-overlay">
        <div class="panel">
          <h2 id="overlay-title">選擇你的搭檔</h2>
          <p id="overlay-text">你是舉球員，搭檔由主攻／副攻中擇一。</p>
          <div class="pos-grid" id="mate-grid">
            <button type="button" class="pos-card" id="mate-spiker" data-pos="spiker">
              <span class="pos-icon">⚡</span>
              <span class="pos-name">主攻手搭檔</span>
              <span class="pos-stat">加速扣球 · 扣得更重</span>
            </button>
            <button type="button" class="pos-card" id="mate-blocker" data-pos="blocker">
              <span class="pos-icon">🛡️</span>
              <span class="pos-name">副攻手搭檔</span>
              <span class="pos-stat">攔網 · 巨牆反彈</span>
            </button>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="pause-overlay">
        <div class="panel">
          <h2>已暫停</h2>
          <p>ESC / ☰ 開啟，選「繼續」或「重新開始」。</p>
          <div class="row">
            <button type="button" class="primary-btn" id="resume-btn">繼續遊戲</button>
            <button type="button" class="primary-btn ghost" id="restart-btn">重新開始</button>
          </div>
        </div>
      </div>
    </div>

    <div class="touchbar">
      <button type="button" class="tbtn" id="btn-left">◀</button>
      <button type="button" class="tbtn" id="btn-right">▶</button>
      <button type="button" class="tbtn" id="btn-serve">F 發球</button>
      <button type="button" class="tbtn" id="btn-jump">⤒ 跳</button>
      <button type="button" class="tbtn" id="btn-receive">Q 接一傳</button>
      <button type="button" class="tbtn" id="btn-hit">E 扣/托</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
